<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投融资股权架构智能体</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 40px;
        }
        
        .command-input {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }
        
        .command-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .examples {
            margin-top: 40px;
            text-align: left;
        }
        
        .examples h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .example-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .example-item:hover {
            background: #e8e8e8;
        }
        
        .example-item strong {
            color: #667eea;
        }
        
        .stats {
            margin-top: 40px;
            display: flex;
            justify-content: space-around;
            padding-top: 30px;
            border-top: 1px solid #ddd;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 投融资架构智能体</h1>
        <p class="subtitle">一句话口令，自动生成或审核股权架构方案</p>
        
        <input 
            type="text" 
            class="command-input" 
            id="commandInput"
            placeholder="输入口令：生成架构 或 审核架构"
            autofocus
        >
        
        <button class="btn" onclick="executeCommand()">执行</button>
        
        <div class="examples">
            <h3>💡 使用示例</h3>
            <div class="example-item" onclick="fillCommand('生成架构')">
                <strong>生成架构</strong><br>
                根据公司情况生成最优股权架构方案
            </div>
            <div class="example-item" onclick="fillCommand('审核架构')">
                <strong>审核架构</strong><br>
                分析现有架构，识别风险并提供优化建议
            </div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">10+</div>
                <div class="stat-label">法规库</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">15+</div>
                <div class="stat-label">案例库</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">8</div>
                <div class="stat-label">架构模板</div>
            </div>
        </div>
    </div>
    
    <script>
        function fillCommand(command) {
            document.getElementById('commandInput').value = command;
        }
        
        function executeCommand() {
            const command = document.getElementById('commandInput').value.trim();
            
            if (!command) {
                alert('请输入口令');
                return;
            }
            
            fetch('/command', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ command: command })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    window.location.href = data.redirect;
                }
            })
            .catch(error => {
                alert('执行失败: ' + error.message);
            });
        }
        
        // 回车键执行
        document.getElementById('commandInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                executeCommand();
            }
        });
    </script>
</body>
</html>
